<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Parsa Home · Offline</title>
<link rel="stylesheet" href="/static/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; color: #eef2ff; background: #0b1020;
       font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif; }
body::before { content: ''; position: fixed; inset: -20%; z-index: -1;
    background: radial-gradient(40% 35% at 20% 15%, #3b2a8f 0%, transparent 70%), radial-gradient(45% 40% at 85% 75%, #0f3d6e 0%, transparent 70%); }
.ic { width: 96px; height: 96px; margin: 0 auto 22px; border-radius: 28px; display: grid; place-items: center; font-size: 2.4rem;
      color: #9aa5c4; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); }
h1 { font-size: 1.4rem; margin-bottom: 8px; }
p { color: #9aa5c4; max-width: 320px; margin: 0 auto 26px; line-height: 1.5; }
button { padding: 14px 28px; border: none; border-radius: 14px; font: inherit; font-weight: 700; color: #fff; cursor: pointer;
         background: linear-gradient(135deg, #8b9bff, #b28dff); }
</style>
</head>
<body>
<main>
    <div class="ic"><i class="fa-solid fa-wifi"></i></div>
    <h1>Can't reach home</h1>
    <p>Your phone is offline, or the home controller is not answering. Nothing was changed.</p>
    <button onclick="location.reload()">Try again</button>
</main>
<script>
    // Back as soon as the connection is
    addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
