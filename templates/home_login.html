<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Parsa Home · Sign in</title>
<link rel="icon" href="{{ url_for('static', filename='images/HomeLogo.png') }}" type="image/png">
<link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
<style>
:root { --bg: #0b1020; --surface: rgba(255,255,255,.06); --border: rgba(255,255,255,.1); --text: #eef2ff; --muted: #9aa5c4; --accent: #8b9bff; --accent-2: #b28dff; --danger: #fb7185; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; color: var(--text); background: var(--bg);
       font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: -20%; z-index: -1;
    background: radial-gradient(40% 35% at 20% 15%, #3b2a8f 0%, transparent 70%), radial-gradient(45% 40% at 85% 75%, #0f3d6e 0%, transparent 70%); }
.box { width: 100%; max-width: 380px; padding: 32px 26px; border-radius: 24px; background: var(--surface); border: 1px solid var(--border);
       backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.logo { width: 64px; height: 64px; border-radius: 18px; display: block; margin: 0 auto 16px; }
h1 { text-align: center; font-size: 1.5rem; letter-spacing: -.02em; }
.sub { text-align: center; color: var(--muted); font-size: .9rem; margin: 6px 0 26px; }
.field { position: relative; margin-bottom: 14px; }
.field i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .9rem; }
input[type=text], input[type=password] { width: 100%; padding: 15px 16px 15px 44px; border-radius: 14px; border: 1px solid var(--border);
       background: rgba(0,0,0,.2); color: var(--text); font: inherit; font-size: 16px; outline: none; transition: border-color .2s; }
input:focus { border-color: var(--accent); }
.remember { display: flex; align-items: center; gap: 10px; margin: 6px 2px 22px; color: var(--muted); font-size: .9rem; cursor: pointer; }
.remember input { width: 18px; height: 18px; accent-color: var(--accent); }
button { width: 100%; padding: 15px; border: none; border-radius: 14px; font: inherit; font-weight: 700; font-size: 1rem; color: #fff; cursor: pointer;
         background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 10px 30px rgba(139,155,255,.3); transition: transform .1s; }
button:active { transform: scale(.98); }
.pk-box { margin-bottom: 18px; }
.pk-btn { display: flex; align-items: center; justify-content: center; gap: 12px; background: rgba(255,255,255,.08);
          border: 1px solid var(--border); box-shadow: none; }
.pk-btn i { font-size: 1.35rem; color: var(--accent); }
.pk-btn:disabled { opacity: .7; }
.pk-note { margin-top: 10px; font-size: .85rem; color: var(--muted); line-height: 1.5; text-align: center; }
.pk-note--bad { color: var(--danger); }
.or { display: flex; align-items: center; gap: 12px; margin: 20px 0 16px; color: var(--muted); font-size: .8rem; }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.pk-tap { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 22px; padding: 24px; text-align: center; cursor: pointer; background: rgba(11,16,32,.92);
          backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.pk-tap .ring { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; font-size: 3.4rem; color: #fff;
                background: radial-gradient(circle at 30% 30%, var(--accent-2), var(--accent)); box-shadow: 0 0 0 10px rgba(139,155,255,.15), 0 0 60px rgba(139,155,255,.45); }
.pk-tap:not(.waiting) .ring { animation: pkpulse 1.6s ease-in-out infinite; }
@keyframes pkpulse { 50% { box-shadow: 0 0 0 22px rgba(139,155,255,.05), 0 0 80px rgba(139,155,255,.6); } }
.pk-tap b { font-size: 1.15rem; max-width: 280px; line-height: 1.4; }
.pk-tap .skip { width: auto; padding: 10px 18px; background: none; box-shadow: none; color: var(--muted); font-weight: 600; font-size: .9rem; }
.error { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 18px; border-radius: 12px;
         background: rgba(251,113,133,.12); border: 1px solid rgba(251,113,133,.35); color: var(--danger); font-size: .9rem; }
</style>
</head>
<body>
<form class="box" method="POST" action="/login">
    <img class="logo" src="{{ url_for('static', filename='images/HomeLogo.png') }}" alt="">
    <h1>Parsa Home</h1>
    <p class="sub">Sign in to control your home</p>
    {% if error %}
    <div class="error"><i class="fa-solid fa-circle-exclamation"></i>{{ error }}</div>
    {% endif %}
    {% if pk_ready %}
    <div class="pk-box" data-pk-login data-pk-rp="{{ pk_rp_id }}"{% if pk_auto %} data-pk-auto="1"{% endif %} hidden>
        <button type="button" class="pk-btn" data-pk-go>
            <i class="fa-solid fa-fingerprint"></i><span data-pk-label>Sign in with fingerprint</span>
        </button>
        <p class="pk-note" data-pk-note hidden></p>
        <div class="or">or use your password</div>
    </div>
    {% endif %}
    <div class="field">
        <i class="fa-solid fa-user"></i>
        <input type="text" name="username" placeholder="Username" autocomplete="username" autocapitalize="none" required{% if not pk_auto %} autofocus{% endif %}>
    </div>
    <div class="field">
        <i class="fa-solid fa-lock"></i>
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    </div>
    <label class="remember"><input type="checkbox" name="remember"> Keep me signed in</label>
    <button type="submit">Sign in</button>
</form>
{% if pk_ready and pk_auto %}
<div class="pk-tap" data-pk-tap role="button" aria-label="Sign in with fingerprint" hidden>
    <span class="ring"><i class="fa-solid fa-fingerprint"></i></span>
    <b data-pk-tap-text>Waiting for your fingerprint…</b>
    <button type="button" class="skip" data-pk-tap-skip>Use password instead</button>
</div>
{% endif %}
{% if pk_ready %}<script src="{{ url_for('static', filename='js/passkey.js') }}"></script>{% endif %}
</body>
</html>
