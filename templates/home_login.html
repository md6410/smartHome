<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Parsa Home · Sign in</title>
<link rel="icon" href="{{ url_for('static', filename='images/HomeLogo.png') }}" type="image/png">
<link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
<style>
:root { --bg: #0b1020; --surface: rgba(255,255,255,.06); --border: rgba(255,255,255,.1); --text: #eef2ff; --muted: #9aa5c4; --accent: #8b9bff; --accent-2: #b28dff; --danger: #fb7185; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; color: var(--text); background: var(--bg);
       font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: -20%; z-index: -1;
    background: radial-gradient(40% 35% at 20% 15%, #3b2a8f 0%, transparent 70%), radial-gradient(45% 40% at 85% 75%, #0f3d6e 0%, transparent 70%); }
.box { width: 100%; max-width: 380px; padding: 32px 26px; border-radius: 24px; background: var(--surface); border: 1px solid var(--border);
       backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
.logo { width: 64px; height: 64px; border-radius: 18px; display: block; margin: 0 auto 16px; }
h1 { text-align: center; font-size: 1.5rem; letter-spacing: -.02em; }
.sub { text-align: center; color: var(--muted); font-size: .9rem; margin: 6px 0 26px; }
.field { position: relative; margin-bottom: 14px; }
.field i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .9rem; }
input[type=text], input[type=password] { width: 100%; padding: 15px 16px 15px 44px; border-radius: 14px; border: 1px solid var(--border);
       background: rgba(0,0,0,.2); color: var(--text); font: inherit; font-size: 16px; outline: none; transition: border-color .2s; }
input:focus { border-color: var(--accent); }
.remember { display: flex; align-items: center; gap: 10px; margin: 6px 2px 22px; color: var(--muted); font-size: .9rem; cursor: pointer; }
.remember input { width: 18px; height: 18px; accent-color: var(--accent); }
button { width: 100%; padding: 15px; border: none; border-radius: 14px; font: inherit; font-weight: 700; font-size: 1rem; color: #fff; cursor: pointer;
         background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 10px 30px rgba(139,155,255,.3); transition: transform .1s; }
button:active { transform: scale(.98); }
.error { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 18px; border-radius: 12px;
         background: rgba(251,113,133,.12); border: 1px solid rgba(251,113,133,.35); color: var(--danger); font-size: .9rem; }
</style>
</head>
<body>
<form class="box" method="POST" action="/login">
    <img class="logo" src="{{ url_for('static', filename='images/HomeLogo.png') }}" alt="">
    <h1>Parsa Home</h1>
    <p class="sub">Sign in to control your home</p>
    {% if error %}
    <div class="error"><i class="fa-solid fa-circle-exclamation"></i>{{ error }}</div>
    {% endif %}
    <div class="field">
        <i class="fa-solid fa-user"></i>
        <input type="text" name="username" placeholder="Username" autocomplete="username" autocapitalize="none" required autofocus>
    </div>
    <div class="field">
        <i class="fa-solid fa-lock"></i>
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
    </div>
    <label class="remember"><input type="checkbox" name="remember"> Keep me signed in</label>
    <button type="submit">Sign in</button>
</form>
</body>
</html>
